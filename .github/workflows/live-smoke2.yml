name: live-smoke
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose ESPN history routes
        shell: bash
        run: |
          set -u
          sleep 20
          echo '--- SUMMARY ---'
          summary="$(curl -sS --max-time 25 'https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=401914282')"
          echo "$summary" | jq '{league:.header.league,season:.header.season}'
          slug="$(echo "$summary" | jq -r '.header.league.slug // empty')"
          echo "SLUG=$slug"
          echo '--- ALL TEAM SCHEDULE ---'
          curl -sS --max-time 25 -o /tmp/all.json -w 'HTTP:%{http_code}\n' 'https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/368/schedule?season=2026'
          head -c 300 /tmp/all.json; echo
          if [ -n "$slug" ]; then
            echo '--- LEAGUE TEAM SCHEDULE ---'
            curl -sS --max-time 25 -o /tmp/league.json -w 'HTTP:%{http_code}\n' "https://site.api.espn.com/apis/site/v2/sports/soccer/$slug/teams/368/schedule?season=2026"
            jq '{events:(.events|length),team:.team.displayName,league:.league}' /tmp/league.json 2>/dev/null || head -c 500 /tmp/league.json
          fi
